<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlueBenny Media</title>
    <style>
        :root {
            --kv-bg: #2F2FA2;
            --kv-text: #f5f7ff;
            --kv-container: 1680px;
            --kv-gutter: 20px;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--kv-bg);
            color: var(--kv-text);
            overflow-x: hidden;
        }

        img {
            display: block;
            max-width: 100%;
        }

        .kv {
            height: 100vh;
            background: var(--kv-bg);
            padding: 32px 24px;
        }

        .kv__container {
            width: min(100%, var(--kv-container));
            height: calc(100vh - 64px);
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(12, minmax(0, 1fr));
            grid-template-rows: 1fr auto;
            column-gap: var(--kv-gutter);
        }

        .kv__title {
            grid-column: 1 / span 5;
            grid-row: 1;
            align-self: start;
            margin: 0;
            font-size: clamp(72px, 10vw, 180px);
            line-height: 0.88;
            font-weight: 700;
            letter-spacing: -0.05em;
            text-transform: uppercase;
        }

        .kv__copy {
            grid-column: 9 / -1;
            grid-row: 2;
            justify-self: end;
            margin: 0;
            text-align: left;
            font-size: clamp(18px, 1.4vw, 26px);
            line-height: 1.35;
            font-weight: 500;
        }

        .horizontal-gallery {
            height: 100vh;
            background: #f4f1ea;
            color: #121212;
            overflow: hidden;
        }

        .horizontal-gallery__track {
            display: flex;
            width: 600vw;
            height: 100vh;
        }

        .gallery-panel {
            width: 100vw;
            height: 100vh;
            flex: 0 0 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .gallery-panel--intro {
            background: #f4f1ea;
        }

        .gallery-panel__copy {
            width: min(100%, 920px);
            margin: 0;
            text-align: center;
            font-size: clamp(28px, 3vw, 54px);
            line-height: 1.22;
            font-weight: 500;
            letter-spacing: -0.03em;
        }

        .gallery-panel--image {
            background: #ebe6dc;
        }

        .gallery-panel__frame {
            width: min(100%, 1180px);
            aspect-ratio: 16 / 10;
            overflow: hidden;
            border-radius: 24px;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.14);
        }

        .gallery-panel__frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @media (max-width: 1024px) {
            .kv {
                padding: 24px 20px;
            }

            .kv__container {
                height: calc(100vh - 48px);
                row-gap: 48px;
            }

            .kv__title {
                grid-column: 1 / span 7;
            }

            .kv__copy {
                grid-column: 7 / -1;
                justify-self: end;
            }
        }

        @media (max-width: 768px) {
            .kv {
                padding: 20px 16px;
            }

            .kv__container {
                height: calc(100vh - 40px);
                grid-template-columns: repeat(4, minmax(0, 1fr));
                grid-template-rows: auto 1fr;
                row-gap: 40px;
            }

            .kv__title,
            .kv__copy {
                grid-column: 1 / -1;
            }

            .kv__copy {
                align-self: end;
                max-width: 420px;
                justify-self: start;
            }

            .gallery-panel {
                padding: 20px;
            }

            .gallery-panel__copy {
                font-size: clamp(22px, 6vw, 34px);
            }

            .gallery-panel__frame {
                aspect-ratio: 4 / 5;
                border-radius: 16px;
            }
        }
    </style>
</head>

<body>
    <section class="kv">
        <div class="kv__container">
            <h1 class="kv__title">
                BlueBenny<br>
                Media
            </h1>
            <p class="kv__copy">
                Home to the catalog of one of the<br>
                most celebrated photographers in<br>
                the entertainment industry,<br>
                E-BENNY.
            </p>
        </div>
    </section>

    <section class="horizontal-gallery">
        <div class="horizontal-gallery__track">
            <article class="gallery-panel gallery-panel--intro">
                <p class="gallery-panel__copy">
                    Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.
                </p>
            </article>

            <article class="gallery-panel gallery-panel--image">
                <div class="gallery-panel__frame">
                    <img src="images/se1.jpg" alt="Gallery image 1">
                </div>
            </article>

            <article class="gallery-panel gallery-panel--image">
                <div class="gallery-panel__frame">
                    <img src="images/se2.jpg" alt="Gallery image 2">
                </div>
            </article>

            <article class="gallery-panel gallery-panel--image">
                <div class="gallery-panel__frame">
                    <img src="images/se3.jpg" alt="Gallery image 3">
                </div>
            </article>

            <article class="gallery-panel gallery-panel--image">
                <div class="gallery-panel__frame">
                    <img src="images/se4.jpg" alt="Gallery image 4">
                </div>
            </article>

            <article class="gallery-panel gallery-panel--image">
                <div class="gallery-panel__frame">
                    <img src="images/se5.jpg" alt="Gallery image 5">
                </div>
            </article>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/locomotive-scroll/bundled/locomotive-scroll.min.js"></script>
    <script>
        gsap.registerPlugin(ScrollTrigger);

        // 세로 스크롤 값을 가로 이동값으로 바꿔서
        // 텍스트 1장 + 이미지 5장이 한 화면씩 보이도록 고정 스크롤을 만듭니다.
        gsap.to('.horizontal-gallery__track', {
            xPercent: -500,
            ease: 'none',
            scrollTrigger: {
                trigger: '.horizontal-gallery',
                start: 'top top',
                // end 값이 클수록 같은 거리(xPercent)를 더 긴 세로 스크롤로 나눠서 움직이므로
                // 체감 속도가 느려집니다.
                // 예: '+=700%' 로 바꾸면 더 천천히, '+=300%' 로 바꾸면 더 빠르게 넘어갑니다.
                end: '+=800%',
                // scrub 값은 스크롤과 애니메이션이 따라붙는 부드러움을 조절합니다.
                // 0 또는 true에 가까우면 즉각 반응하고,
                // 숫자가 커질수록 조금 더 늦게 따라오면서 부드럽게 보입니다.
                scrub: 5,
                pin: true,
                anticipatePin: 1,
                snap: {
                    // snapTo: 1 / 5 는 총 6개 패널(텍스트 1 + 이미지 5)을
                    // 한 장씩 끊어서 멈추게 만드는 설정입니다.
                    snapTo: 1 / 5,
                    // duration이 길수록 다음 패널에 붙는 시간이 길어져
                    // 전환 속도가 더 부드럽고 느리게 느껴집니다.
                    duration: 0.45,
                    ease: 'power1.inOut'
                }
            }
        });
    </script>
</body>

</html>
