<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box; /* 레이아웃 계산을 편하게 하기 위해 추가 */
        }

        .flex {
            display: flex;
            gap: 10px; /* 박스 사이 간격 추가 (선택사항) */
        }

        .box {
            width: 100%;
            height: 200px;
            margin: 20px 0;
        }

        /* 각 박스에 순서대로 다른 색상 부여 (20개) */
        .box:nth-child(1) { background-color: #FF6B6B; }
        .box:nth-child(2) { background-color: #FF9E2C; }
        .box:nth-child(3) { background-color: #FFD93D; }
        .box:nth-child(4) { background-color: #6BCB77; }
        .box:nth-child(5) { background-color: #4D96FF; }
        .box:nth-child(6) { background-color: #6C5CE7; }
        .box:nth-child(7) { background-color: #A29BFE; }
        .box:nth-child(8) { background-color: #FAB1A0; }
        .box:nth-child(9) { background-color: #55E6C1; }
        .box:nth-child(10) { background-color: #FD79A8; }
        .box:nth-child(11) { background-color: #E17055; }
        .box:nth-child(12) { background-color: #00B894; }
        .box:nth-child(13) { background-color: #0984E3; }
        .box:nth-child(14) { background-color: #D63031; }
        .box:nth-child(15) { background-color: #E84393; }
        .box:nth-child(16) { background-color: #2D3436; }
        .box:nth-child(17) { background-color: #636E72; }
        .box:nth-child(18) { background-color: #B2BEC3; }
        .box:nth-child(19) { background-color: #FFEAA7; }
        .box:nth-child(20) { background-color: #81ECEC; }
    </style>
</head>

<body>
    <div class="box"></div>
    <div class="box"></div>
    
    <div class="flex">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>

    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box" data-aos="fade-down-right"></div>
</body>

</html>
