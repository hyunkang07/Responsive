<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .panel {
  position: absolute; width: 100%; height: 100vh;
  background-size: cover; background-position: center;
  display: flex; justify-content: center; align-items: center;
  overflow: hidden; clip-path: inset(0 0 0 0); /* 배경이 잘리는 느낌을 위해 */
}

.content h1 {
  font-size: 5vw; color: white; text-transform: uppercase;
  transform: translateY(100px) skewY(10deg); /* 아래에 숨고 기울어짐 */
  opacity: 0;
  transition: all 0.8s;
}

/* 활성화된 섹션의 글자 스타일 */
.panel.active .content h1 {
  transform: translateY(0) skewY(0);
  opacity: 1;
}
    </style>
</head>
<body>
    
<div class="container">
  <section class="panel" style="background-image: url('./images/bg-1.png')">
    <div class="content"><h1>99moster's Visual 01</h1></div>
  </section>
  <section class="panel" style="background-image: url('./images/bg-2.png')">
    <div class="content"><h1>Dynamic Motion 02</h1></div>
  </section>
  </div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/Observer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollTrigger.min.js"></script>
<!-- ScrollSmoother requires ScrollTrigger -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollSmoother.min.js"></script>
  <script>
    gsap.registerPlugin(Observer);

let sections = document.querySelectorAll(".panel");
let currentIndex = 0;
let step = 0; // 0: 글자 애니메이션 단계, 1: 배경 교체 준비 단계
let animating = false;

// 첫 번째 섹션 글자는 미리 보여주기
sections[0].classList.add("active");

function handleScroll(direction) {
  if (animating) return;

  // 아래로 스크롤할 때 (direction 1)
  if (direction === 1) {
    if (step === 0) {
      // [1단계] 현재 섹션의 추가 애니메이션 (예: 글자 강조나 효과)
      // 여기서는 다음 배경으로 넘어가기 위한 '준비' 동작을 넣습니다.
      step = 1;
      showDetailAnimation(currentIndex); 
    } else {
      // [2단계] 다음 배경으로 진짜 이동
      if (currentIndex < sections.length - 1) {
        step = 0;
        gotoSection(currentIndex + 1, 1);
      }
    }
  } 
  // 위로 스크롤할 때 (direction -1)
  else {
    if (currentIndex > 0) {
      step = 0;
      gotoSection(currentIndex - 1, -1);
    }
  }
}

function gotoSection(index, direction) {
  animating = true;
  
  // 기존 섹션 나가는 애니메이션
  gsap.to(sections[currentIndex], {
    yPercent: direction === 1 ? -100 : 100,
    duration: 1.2,
    ease: "expo.inOut"
  });
  sections[currentIndex].classList.remove("active");

  // 새 섹션 들어오는 애니메이션 (확대되며 나타나는 효과)
  gsap.fromTo(sections[index], 
    { yPercent: direction === 1 ? 100 : -100, scale: 1.2 }, 
    { yPercent: 0, scale: 1, duration: 1.2, ease: "expo.inOut", 
      onComplete: () => {
        animating = false;
        sections[index].classList.add("active");
      }
    }
  );

  currentIndex = index;
}

// 상세 효과 (글자가 더 커지거나 배경이 어두워지는 등)
function showDetailAnimation(index) {
  animating = true;
  gsap.to(sections[index].querySelector("h1"), {
    scale: 1.5, 
    duration: 0.5, 
    yoyo: true, 
    repeat: 1,
    onComplete: () => { animating = false; }
  });
}

Observer.create({
  target: window,
  type: "wheel,touch",
  onDown: () => handleScroll(1),
  onUp: () => handleScroll(-1),
  tolerance: 10
});
  </script>
    
</body>
</html>
