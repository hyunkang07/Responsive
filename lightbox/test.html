       선배 개발자로서 다시 한번 꼼꼼하게 정리해 드릴게요.

후배님이 원하시는 핵심은 "글자는 무대 중앙에 딱 붙어 움직이지 않고, 그 뒤로 이미지가 슥 올라오면서 글자색을 흰색으로 물들인다"는 것이죠?

이걸 완벽하게 구현하려면 글자는 fixed 또는 sticky로 화면 중앙에 박아두고, 이미지 박스의 height를 조절하여 글자 뒤를 덮는 방식이 가장 확실합니다.

 아, 후배님! 어떤 느낌인지 딱 알겠습니다. 단순히 전체 글자색이 한꺼번에 변하는 게 아니라, 이미지가 글자를 지나가는 그 '경계선'을 따라 글자색이 실시간으로 변하는 효과를 원하시는군요!

이건 17년 차 개발자들도 포트폴리오 사이트 만들 때 정말 공들여서 만드는 '색상 반전(Color Inversion) 마스킹' 기법입니다.

이 효과의 핵심 비결은 똑같은 글자를 두 개 겹쳐놓는 것입니다.

아래층(검정 글자): 배경이 흰색일 때 보입니다.

위층(흰색 글자): 이미지가 올라올 때 그 이미지 박스 안에만 갇혀서 보입니다. 이미지 박스가 커질수록 그 안에 담긴 흰색 글자가 점점 더 많이 드러나는 원리죠.

고등학생도 이해할 수 있게 가장 직관적인 코드로 짜왔습니다.

🛠️ 마스킹 기법을 이용한 '경계선 색상 반전' 애니메이션
HTML
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>한화 About KV - 정교한 마스킹 반전</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <style>
 body, h2 { margin: 0; padding: 0; font-family: sans-serif; }

        .kv-container {
            position: relative;
            height: 300vh;
            background-color: #fff;
        }

        .kv-sticky-wrapper {
            position: sticky;
            top: 0;
            height: 100vh;
            width: 100%;
            overflow: hidden;
        }

        /* [공통] 두 글자가 완벽히 겹치도록 설정 */
        .title-wrap {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            text-align: center;
            font-size: 3.5rem;
            font-weight: 700;
            line-height: 1.3;
            white-space: nowrap;
        }

        /* 1층: 바닥에 깔린 검정 글자 */
        .kv-title-black {
            color: #000;
            z-index: 1;
        }

        /* 2층: 이미지를 담고 있는 '돋보기' 박스 (마스크 역할) */
        .kv-title-img-mask {
            position: absolute;
            bottom: 0; /* 아래서부터 차오름 */
            left: 50%;
            transform: translateX(-50%);
            width: 80%; /* 처음 가로 80% */
            height: 0vh; /* 처음 높이 0 */
            z-index: 5;
            overflow: hidden; /* 이 박스 영역 밖의 흰 글자는 절대 안 보임 */
            border-radius: 20px 20px 0 0;
        }

        /* 마스크 안의 배경 이미지 */
        .bg-img {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100vw;
            height: 100vh;
            object-fit: cover;
        }

        /* [핵심] 3층: 이미지 박스 안에 갇힌 흰색 글자 */
        /* 부모인 mask가 bottom:0 이므로, 이 녀석은 고정된 위치를 유지하기 위해 역계산이 필요함 */
        .kv-title-white {
            position: absolute;
            /* 부모(.kv-title-img-mask)가 밑에서 위로 올라오더라도, 
               이 글자는 화면 중앙에 가만히 있어야 하므로 sticky처럼 고정 */
            bottom: 0; 
            left: 50%;
            transform: translateX(-50%);
            width: 100vw;
            height: 100vh; /* 화면 높이만큼 확보 */
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            z-index: 10;
        }
    </style>
</head>
<body>
<div class="kv-container">
        <div class="kv-sticky-wrapper">
            
            <div class="title-wrap kv-title-black">
                지속가능한 내일을 위한<br>
                한화의 담대한 도전은 멈추지 않습니다.
            </div>

            <div class="kv-title-img-mask">
                <img src="assets/images/about-img-discover.png" alt="Challenge" class="bg-img">
                
                <div class="kv-title-white">
                    <div class="title-wrap">
                        지속가능한 내일을 위한<br>
                        한화의 담대한 도전은 멈추지 않습니다.
                    </div>
                </div>
            </div>

        </div>
    </div>

    <div style="height: 100vh; background: #000;"></div>
     <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollTrigger.min.js"></script>
    <!-- ScrollSmoother requires ScrollTrigger -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollSmoother.min.js"></script>

    <script>
gsap.registerPlugin(ScrollTrigger);

        const tl = gsap.timeline({
            scrollTrigger: {
                trigger: ".kv-container",
                start: "top top",
                end: "bottom bottom",
                scrub: 1,
            }
        });

        // 이미지를 담은 박스(돋보기)가 위로 슥 올라옴
        tl.to(".kv-title-img-mask", {
            height: "100vh",   // 밑에서 위로 100% 차오름
            width: "100%",     // 가로도 100%로 확장
            borderRadius: "0px",
            duration: 2,
            ease: "none"
        });
    </script>
</body>
</html>
