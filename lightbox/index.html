<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
body, h1, p { margin: 0; padding: 0; overflow-x: hidden; }

        /* 1. KV 영역 */
        .kv-section {
            height: 100vh;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            z-index: 10;
        }

        /* 2. 메인 애니메이션 전체 컨테이너 */
        .about-wrapper {
            position: relative;
            height: 400vh; /* 스크롤 길이를 결정 (길수록 천천히 바뀜) */
            background-color: #fff;
        }

        .split-container {
            display: flex;
            width: 100%;
            height: 100vh; /* 화면에 꽉 차게 */
            position: relative;
        }

        /* 왼쪽 텍스트 영역 (가운데 고정) */
        .left-text-area {
            width: 50%;
            height: 100vh;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .text-box {
            position: absolute; /* 모든 텍스트를 한 자리에 겹침 */
            text-align: center;
            font-size: 2.5rem;
            font-weight: bold;
            line-height: 1.5;
            opacity: 0; /* 처음엔 숨김 */
            transform: translateY(30px); /* 살짝 아래에서 대기 */
        }

        /* 오른쪽 이미지 영역 (가운데 고정) */
        .right-image-area {
            width: 50%;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        .img-box {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            opacity: 0;
        }
        .img-box img { width: 100%; height: 100%; object-fit: cover; }

        /* 초기 상태 설정 (첫 번째 요소 노출) */
        .text-box.active, .img-box.active {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>

<body>

<section class="kv-section">
        <h1>지속가능한 내일을 위해<br>끊임없는 도전을 이어갑니다.</h1>
    </section>

    <div class="about-wrapper">
        <div class="split-container">
            <div class="left-text-area">
                <div class="text-box active">01. 내일을 향한<br>우리의 보호 (Protect)</div>
                <div class="text-box">02. 새로운 가치를<br>발견하다 (Discover)</div>
                <div class="text-box">03. 더 멀리 가는<br>지속가능성 (Sustainable)</div>
            </div>

            <div class="right-image-area">
                <div class="img-box active"><img src="assets/images/about-img-protect.png" alt="Protect"></div>
                <div class="img-box"><img src="assets/images/about-img-discover.png" alt="Discover"></div>
                <div class="img-box"><img src="assets/images/about-img-sustainable.png" alt="Sustainable"></div>
            </div>
        </div>
    </div>

    <div style="height: 100vh; background: #eee;"></div>


    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollTrigger.min.js"></script>
    <!-- ScrollSmoother requires ScrollTrigger -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollSmoother.min.js"></script>

    <script>
        gsap.registerPlugin(ScrollTrigger);

        const texts = gsap.utils.toArray(".text-box");
        const images = gsap.utils.toArray(".img-box");

        // [핵심] 전체 컨테이너를 화면에 고정(Pin)합니다.
        // 스크롤이 about-wrapper를 지나는 동안 화면은 멈춰있고 애니메이션만 일어납니다.
        ScrollTrigger.create({
            trigger: ".about-wrapper",
            start: "top top",
            end: "bottom bottom",
            pin: ".split-container",
            scrub: 1,
        });

        // 각 단계별로 텍스트와 이미지가 교체되는 타임라인 생성
        const tl = gsap.timeline({
            scrollTrigger: {
                trigger: ".about-wrapper",
                start: "top top",
                end: "bottom bottom",
                scrub: 1,
            }
        });

        // 첫 번째는 이미 보이므로, 두 번째 요소부터 순차적으로 등장시키기
        texts.forEach((_, i) => {
            if (i === 0) return; // 첫 번째는 무시

            tl.to(texts[i-1], { opacity: 0, y: -30, duration: 1 }, i) // 이전 텍스트 사라짐
              .to(images[i-1], { opacity: 0, duration: 1 }, i)        // 이전 이미지 사라짐
              .to(texts[i], { opacity: 1, y: 0, duration: 1 }, i)     // 현재 텍스트 나타남
              .to(images[i], { opacity: 1, duration: 1 }, i);        // 현재 이미지 나타남
        });
    </script>

</body>

</html>
